<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="files/all.css">
</head>
<body>

<!-- BANNER: положи img/banner.jpg чтобы показалась фотография -->
<div class="banner">
  <img class="banner-img" src="img/016.png" alt="" onerror="this.style.display='none'">
</div>

<div class="wrap">

  <!-- HEADER: аватар поверх баннера слева, лого справа -->
  <div class="header-row">
    <div class="avatar" id="avatarEl">
      <img src="img/015.png" alt="avatar" onerror="this.style.display='none'">
    </div>
    <div class="logo">
      <img src="img/logo.png" alt="logo"
           onerror="this.outerHTML='<span class=\'logo-fallback\'>◈ MyProfile</span>'">
    </div>
  </div>

  <!-- NAME -->
  <div class="profile-name" id="profileName">Omer Vegh</div>
  <div class="profile-nick">
    <span id="profileNick">@omer-vegh</span>
    <!-- Verify: положи img/verify.png, или будет SVG-галочка как fallback -->
    <img class="verify" src="img/verify.png" alt="✓"
         onerror="this.outerHTML='<svg class=\'verify\' viewBox=\'0 0 24 24\' fill=\'%233f6593\'><path d=\'M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z\'/></svg>'">
  </div>

  <!-- SOCIALS -->
  <!-- Иконки берутся из img/logo/linkedin.png и img/logo/github.png -->
  <!-- Если файла нет — иконка просто не показывается, текст остаётся -->
  <div class="social-row">
    <a class="social-btn" href="#" target="_blank" rel="noopener">
      <img class="s-icon" src="img/linkedin.png" alt=""
           onerror="this.style.display='none'">
      LinkedIn
    </a>
  </div>

  <div class="divider"></div>

  <!-- POST -->
  <div class="post-card" id="post-0">
    <!-- Фото поста: положи img/post1.jpg и раскомментируй строку ниже -->
    <img class="post-img" src="img/unknow.png" alt="post">
    <div class="post-body">
      <p class="post-text">
        ///
      </p>
      <div class="stats-row">
        <div class="stat-views">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
          <span id="v-0">—</span> view
        </div>
        <div class="reactions">
          <button class="rbtn" id="rb-0-like"  onclick="react(0,'like')">👍 <span class="cnt" id="rc-0-like">0</span></button>
          <button class="rbtn" id="rb-0-fire"  onclick="react(0,'fire')">🔥 <span class="cnt" id="rc-0-fire">0</span></button>
          <button class="rbtn" id="rb-0-clap"  onclick="react(0,'clap')">👏 <span class="cnt" id="rc-0-clap">0</span></button>
          <button class="rbtn" id="rb-0-heart" onclick="react(0,'heart')">❤️ <span class="cnt" id="rc-0-heart">0</span></button>
        </div>
      </div>
      <div class="save-msg" id="msg-0"></div>
    </div>
  </div>

</div>

<script type="module">
  // Подключаем Firebase напрямую из CDN
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // КОНФИГУРАЦИЯ: Вставь сюда свою ссылку из Firebase
  const firebaseConfig = {
    databaseURL: "https://physio-cube-default-rtdb.firebaseio.com/"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const used = {}; // Блокировка повторных кликов

  const el = id => document.getElementById(id);

  // ─── ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ────────────────────────
  function updateUI(postId, data) {
    if (!data) return;
    
    // Обновляем просмотры
    const viewsEl = el(`v-${postId}`);
    if (viewsEl) viewsEl.textContent = data.views || 0;

    // Обновляем реакции
    ['like', 'fire', 'clap', 'heart'].forEach(emoji => {
      const countEl = el(`rc-${postId}-${emoji}`);
      if (countEl) {
        countEl.textContent = (data.reactions && data.reactions[emoji]) || 0;
      }
    });
  }

  // ─── СЛУШАТЕЛЬ ДАННЫХ (Realtime) ──────────────────
  // Эта функция сама обновит цифры на странице, когда кто-то другой кликнет
  const postRef = ref(db, 'stats/post-0');
  onValue(postRef, (snapshot) => {
    updateUI(0, snapshot.val());
  });

  // ─── СЧЕТЧИК ПРОСМОТРОВ ───────────────────────────
  async function trackView() {
    if (!sessionStorage.getItem('viewed_0')) {
      sessionStorage.setItem('viewed_0', '1');
      const viewsRef = ref(db, 'stats/post-0/views');
      
      // Используем транзакцию, чтобы счетчик не сбивался при одновременных заходах
      runTransaction(viewsRef, (current) => (current || 0) + 1);
    }
  }

  // ─── ФУНКЦИЯ РЕАКЦИИ ──────────────────────────────
  window.react = function(postId, emoji) {
    const key = `${postId}-${emoji}`;
    if (used[key]) return; // Защита от спама кликами
    used[key] = true;

    const btn = el(`rb-${postId}-${emoji}`);
    btn?.classList.add('active');

    const reactionRef = ref(db, `stats/post-${postId}/reactions/${emoji}`);
    
    // Атомарное увеличение на +1
    runTransaction(reactionRef, (current) => (current || 0) + 1)
      .catch(() => {
        // Если ошибка — возвращаем кнопку в исходное состояние
        used[key] = false;
        btn?.classList.remove('active');
      });
  };

  // Запуск
  trackView();
</script>
</body>
</html>
