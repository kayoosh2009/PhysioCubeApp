<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1b3554;
    --blue: #3f6593;
    --light: #f0f4f9;
    --white: #f8fafc;
    --card: #ffffff;
    --text: #1b3554;
    --muted: #6b849e;
    --border: rgba(63,101,147,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--light);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── BANNER ── */
  .banner {
    width: 100%;
    height: 220px;
    background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 60%, #5a84b8 100%);
    position: relative;
    overflow: hidden;
  }
  .banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  /* ── PROFILE CONTAINER ── */
  .profile-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* ── AVATAR ── */
  .avatar-row {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    margin-top: -52px;
    margin-bottom: 16px;
  }
  .avatar {
    width: 104px;
    height: 104px;
    border-radius: 50%;
    border: 4px solid var(--white);
    background: var(--blue);
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 4px 20px rgba(27,53,84,0.18);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* ── LOGO (shown in avatar row) ── */
  .logo-badge {
    font-family: 'DM Serif Display', serif;
    font-size: 13px;
    color: var(--white);
    background: var(--navy);
    padding: 5px 12px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    border: 1.5px solid rgba(255,255,255,0.2);
  }

  /* ── NAME & NICK ── */
  .profile-name {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    color: var(--navy);
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .profile-nick {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--muted);
    font-weight: 400;
  }
  .verify-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  /* ── SOCIAL LINKS ── */
  .social-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .social-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 30px;
    text-decoration: none;
    color: var(--navy);
    font-size: 13px;
    font-weight: 500;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 1px 4px rgba(27,53,84,0.07);
  }
  .social-btn:hover {
    background: var(--blue);
    color: var(--white);
    border-color: var(--blue);
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(63,101,147,0.25);
  }
  .social-btn:hover svg path,
  .social-btn:hover svg rect,
  .social-btn:hover svg circle,
  .social-btn:hover svg polygon { fill: white; }
  .social-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  /* ── DIVIDER ── */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 22px 0;
    border-radius: 1px;
  }

  /* ── POST CARD ── */
  .post-card {
    background: var(--card);
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 2px 16px rgba(27,53,84,0.06);
  }
  .post-img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
    background: linear-gradient(135deg, #d0dff0 0%, #b8cde4 100%);
    min-height: 200px;
  }
  .post-img-placeholder {
    width: 100%;
    aspect-ratio: 16/9;
    min-height: 200px;
    background: linear-gradient(135deg, #c8daf0 0%, #a8c0dc 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--blue);
    font-size: 14px;
    opacity: 0.7;
  }
  .post-body {
    padding: 20px 22px 16px;
  }
  .post-text {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 16px;
  }

  /* ── STATS ROW ── */
  .stats-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .stat-views {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: var(--muted);
  }
  .stat-views svg { width: 14px; height: 14px; opacity: 0.7; }

  /* ── REACTIONS ── */
  .reactions {
    display: flex;
    gap: 6px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  .reaction-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px 11px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--light);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.18s;
    color: var(--navy);
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
  }
  .reaction-btn:hover { background: #dce8f5; border-color: var(--blue); transform: scale(1.05); }
  .reaction-btn.active { background: var(--blue); border-color: var(--blue); color: white; }
  .reaction-btn .count { font-size: 12px; min-width: 14px; }

  /* ── LOADING / ERROR ── */
  .status-msg {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
    text-align: right;
    min-height: 16px;
  }
  .status-msg.error { color: #c0392b; }
</style>
</head>
<body>

<!-- ══════════ CONFIG — EDIT THIS ══════════ -->
<script>
const CONFIG = {
  // GitHub данные для хранения просмотров
  GITHUB_OWNER: 'YOUR_USERNAME',       // ← ваш username
  GITHUB_REPO:  'YOUR_REPO',           // ← название репозитория
  GITHUB_FILE:  'data.json',           // ← путь к файлу в репозитории
  GITHUB_TOKEN: 'YOUR_TOKEN_HERE',     // ← Personal Access Token (repo scope)

  // Профиль
  name:      'Имя Фамилия',
  username:  '@username',
  verifyImg: 'img/verify.png',
  avatarImg: 'img/avatar.jpg',         // или '' чтобы показать инициалы

  // Посты — массив, можно добавлять
  posts: [
    {
      img:  'img/post1.jpg',           // '' — без фото
      text: 'Это мой первый пост. Здесь можно написать что угодно — поделиться мыслями, анонсировать проект или просто поздороваться. 👋'
    }
  ],

  // Соц сети
  socials: [
    { label: 'LinkedIn', url: 'https://linkedin.com/in/YOUR', type: 'linkedin' },
    { label: 'GitHub',   url: 'https://github.com/YOUR',      type: 'github'   }
  ]
};
</script>
<!-- ══════════════════════════════════════ -->

<!-- BANNER -->
<div class="banner" id="banner"></div>

<div class="profile-wrap">

  <!-- AVATAR + NAME -->
  <div class="avatar-row">
    <div class="avatar" id="avatarEl">
      <!-- заполняется JS -->
    </div>
    <div>
      <div class="logo-badge" id="logoBadge">◈ Profile</div>
    </div>
  </div>

  <div class="profile-name" id="profileName"></div>
  <div class="profile-nick">
    <span id="profileNick"></span>
    <img class="verify-icon" id="verifyIcon" src="" alt="verified">
  </div>

  <!-- СОЦСЕТИ -->
  <div class="social-row" id="socialRow"></div>

  <div class="divider"></div>

  <!-- ПОСТЫ -->
  <div id="postsContainer"></div>

</div>

<!-- SVG-иконки (inline, не нужны внешние файлы) -->
<svg style="display:none">
  <symbol id="icon-linkedin" viewBox="0 0 24 24">
    <path fill="#0077b5" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
  </symbol>
  <symbol id="icon-github" viewBox="0 0 24 24">
    <path fill="#1b3554" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
  </symbol>
  <symbol id="icon-eye" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
  </symbol>
</svg>

<script>
// ──────────────────────────────────────────
// RENDER PROFILE
// ──────────────────────────────────────────
(function renderProfile() {
  const c = CONFIG;

  // Avatar
  const av = document.getElementById('avatarEl');
  if (c.avatarImg) {
    av.innerHTML = `<img src="${c.avatarImg}" alt="avatar">`;
  } else {
    const initials = c.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    av.innerHTML = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:600;color:#f0f4f9;font-family:'DM Serif Display',serif">${initials}</div>`;
  }

  // Name & nick
  document.getElementById('profileName').textContent = c.name;
  document.getElementById('profileNick').textContent = c.username;
  const vi = document.getElementById('verifyIcon');
  vi.src = c.verifyImg;
  vi.onerror = () => { vi.style.display='none'; };

  // Socials
  const row = document.getElementById('socialRow');
  const svgMap = { linkedin: 'icon-linkedin', github: 'icon-github' };
  c.socials.forEach(s => {
    const a = document.createElement('a');
    a.className = 'social-btn';
    a.href = s.url;
    a.target = '_blank';
    a.rel = 'noopener';
    const iconId = svgMap[s.type] || '';
    a.innerHTML = `${iconId ? `<svg><use href="#${iconId}"/></svg>` : ''}<span>${s.label}</span>`;
    row.appendChild(a);
  });
})();

// ──────────────────────────────────────────
// RENDER POSTS
// ──────────────────────────────────────────
(function renderPosts() {
  const container = document.getElementById('postsContainer');
  CONFIG.posts.forEach((post, idx) => {
    const el = document.createElement('div');
    el.className = 'post-card';
    el.style.marginBottom = '20px';

    let imgHtml = '';
    if (post.img) {
      imgHtml = `<img class="post-img" src="${post.img}" alt="post image" onerror="this.parentNode.querySelector('.post-img-placeholder')&&(this.style.display='none')">`;
    } else {
      imgHtml = `<div class="post-img-placeholder"><span>📷 Добавьте img в CONFIG.posts[${idx}].img</span></div>`;
    }

    el.innerHTML = `
      ${imgHtml}
      <div class="post-body">
        <p class="post-text">${post.text}</p>
        <div class="stats-row">
          <div class="stat-views">
            <svg><use href="#icon-eye"/></svg>
            <span id="views-count-${idx}">—</span>
            <span>просмотров</span>
          </div>
          <div class="reactions" id="reactions-${idx}">
            <button class="reaction-btn" data-post="${idx}" data-emoji="like" onclick="handleReact(${idx},'like')">👍 <span class="count" id="r-${idx}-like">0</span></button>
            <button class="reaction-btn" data-post="${idx}" data-emoji="fire" onclick="handleReact(${idx},'fire')">🔥 <span class="count" id="r-${idx}-fire">0</span></button>
            <button class="reaction-btn" data-post="${idx}" data-emoji="clap" onclick="handleReact(${idx},'clap')">👏 <span class="count" id="r-${idx}-clap">0</span></button>
            <button class="reaction-btn" data-post="${idx}" data-emoji="heart" onclick="handleReact(${idx},'heart')">❤️ <span class="count" id="r-${idx}-heart">0</span></button>
          </div>
        </div>
        <div class="status-msg" id="status-${idx}"></div>
      </div>
    `;
    container.appendChild(el);
  });
})();

// ──────────────────────────────────────────
// GITHUB DATA STORAGE
// ──────────────────────────────────────────
let ghSHA = null;  // нужен для обновления файла через API
let ghData = null; // кэш данных

// Структура данных по умолчанию
function defaultData() {
  const data = { posts: {} };
  CONFIG.posts.forEach((_, i) => {
    data.posts[i] = { views: 0, reactions: { like:0, fire:0, clap:0, heart:0 } };
  });
  return data;
}

function setStatus(idx, msg, isError) {
  const el = document.getElementById(`status-${idx}`);
  if (!el) return;
  el.textContent = msg;
  el.className = 'status-msg' + (isError ? ' error' : '');
}

function updateUI(data) {
  CONFIG.posts.forEach((_, idx) => {
    const pd = data.posts && data.posts[idx] ? data.posts[idx] : { views:0, reactions:{like:0,fire:0,clap:0,heart:0} };
    const vc = document.getElementById(`views-count-${idx}`);
    if (vc) vc.textContent = pd.views || 0;
    ['like','fire','clap','heart'].forEach(e => {
      const rc = document.getElementById(`r-${idx}-${e}`);
      if (rc) rc.textContent = (pd.reactions && pd.reactions[e]) || 0;
    });
  });
}

async function fetchData() {
  const { GITHUB_OWNER, GITHUB_REPO, GITHUB_FILE, GITHUB_TOKEN } = CONFIG;
  if (!GITHUB_TOKEN || GITHUB_TOKEN === 'YOUR_TOKEN_HERE') {
    CONFIG.posts.forEach((_,i) => setStatus(i, '⚠️ Укажите GITHUB_TOKEN в CONFIG', true));
    return null;
  }
  try {
    const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
      headers: { Authorization: `token ${GITHUB_TOKEN}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (!res.ok) {
      if (res.status === 404) {
        // файл не найден — создадим позже при первом сохранении
        return defaultData();
      }
      throw new Error(`HTTP ${res.status}`);
    }
    const json = await res.json();
    ghSHA = json.sha;
    const decoded = JSON.parse(atob(json.content.replace(/\n/g,'')));
    // Дополняем, если добавились новые посты
    if (!decoded.posts) decoded.posts = {};
    CONFIG.posts.forEach((_,i) => {
      if (!decoded.posts[i]) decoded.posts[i] = { views:0, reactions:{like:0,fire:0,clap:0,heart:0} };
    });
    return decoded;
  } catch (e) {
    CONFIG.posts.forEach((_,i) => setStatus(i, `Ошибка загрузки: ${e.message}`, true));
    return null;
  }
}

async function saveData(data) {
  const { GITHUB_OWNER, GITHUB_REPO, GITHUB_FILE, GITHUB_TOKEN } = CONFIG;
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
  const body = { message: 'update stats', content };
  if (ghSHA) body.sha = ghSHA;
  const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
    method: 'PUT',
    headers: {
      Authorization: `token ${GITHUB_TOKEN}`,
      'Content-Type': 'application/json',
      Accept: 'application/vnd.github.v3+json'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`Save failed: HTTP ${res.status}`);
  const json = await res.json();
  ghSHA = json.content.sha;
}

// ──────────────────────────────────────────
// VIEWS — считаем при загрузке
// ──────────────────────────────────────────
async function countView() {
  // Проверяем сессионное хранилище, чтобы не плюсовать при каждом рефреше
  const key = `viewed_${CONFIG.GITHUB_OWNER}_${CONFIG.GITHUB_REPO}`;
  const alreadySeen = sessionStorage.getItem(key);

  ghData = await fetchData();
  if (!ghData) return;

  updateUI(ghData);

  if (!alreadySeen) {
    sessionStorage.setItem(key, '1');
    CONFIG.posts.forEach((_, i) => {
      ghData.posts[i].views = (ghData.posts[i].views || 0) + 1;
    });
    try {
      await saveData(ghData);
      updateUI(ghData);
    } catch(e) {
      // non-critical
    }
  }
}

// ──────────────────────────────────────────
// РЕАКЦИИ
// ──────────────────────────────────────────
const userReacted = {}; // { "0-like": true }

async function handleReact(postIdx, emoji) {
  const key = `${postIdx}-${emoji}`;
  if (userReacted[key]) return;          // уже нажали

  if (!ghData) {
    setStatus(postIdx, 'Данные ещё загружаются...', false);
    return;
  }

  userReacted[key] = true;
  const btn = document.querySelector(`[data-post="${postIdx}"][data-emoji="${emoji}"]`);
  if (btn) btn.classList.add('active');

  ghData.posts[postIdx].reactions[emoji] = (ghData.posts[postIdx].reactions[emoji] || 0) + 1;
  updateUI(ghData);
  setStatus(postIdx, 'Сохраняем...', false);

  try {
    await saveData(ghData);
    setStatus(postIdx, '', false);
  } catch(e) {
    setStatus(postIdx, `Ошибка сохранения: ${e.message}`, true);
    // Откат
    ghData.posts[postIdx].reactions[emoji]--;
    userReacted[key] = false;
    if (btn) btn.classList.remove('active');
    updateUI(ghData);
  }
}

// ──────────────────────────────────────────
// ЗАПУСК
// ──────────────────────────────────────────
countView();
</script>
</body>
</html>
