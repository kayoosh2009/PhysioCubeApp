<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Physio Cube – Register</title>
    <link rel="icon" href="https://i.ibb.co/kgKXMwgq/round.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../css/register.css">
</head>
<body>

    <section class="card">
        <img src="../../../../img/logo.png" alt="Physio Cube logo" class="project-logo">

        <h2>Create Account</h2>

        <form id="registerForm">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <div class="input-group">
                <label>First Name</label>
                <input type="text" id="firstName" required>
            </div>
            <div class="input-group">
                <label>Last Name</label>
                <input type="text" id="lastName" required>
            </div>
            <div class="input-group">
                <label>Personal ID</label>
                <input type="text" id="personalId">
            </div>
            <div class="input-group">
                <label>Gender</label>
                <select id="gender">
                    <option value="">Select gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="input-group">
                <label>Sport</label>
                <input type="text" id="sport">
            </div>
            <div class="input-group">
                <label>Medical Card (Hospital)</label>
                <select id="hospital">
                    <option value="">Select hospital</option>
                    <option value="Clalit">Clalit</option>
                    <option value="Macabi">Macabi</option>
                    <option value="Meuhedet">Meuhedet</option>
                    <option value="Leumit">Leumit</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Register</button>

            <button type="submit" class="btn btn-primary" id="submitBtn">Register</button>
        </form>

        <div class="extra-links">
            <a href="login.html" class="btn btn-secondary">Already have an account? Log in</a>
            <a href="../main.html" style="color: #999; font-size: 0.9rem; text-decoration: none;">Back to Home</a>
        </div>
    </section>

    <script src="../../js/register.js" defer></script>
</body>
</html>
