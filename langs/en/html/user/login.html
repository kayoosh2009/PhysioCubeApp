<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Physio Cube – Login</title>
    <link rel="icon" href="https://i.ibb.co/kgKXMwgq/round.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href=".././../../../img/mini-logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../../css/login.css">
</head>
<body>

<section class="card">
    <img src="../../../../img/logo.png"
         alt="Physio Cube logo" class="project-logo">

    <h2>Welcome Back</h2>

    <form id="loginForm">
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email"
                   placeholder="you@example.com">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password"
                   placeholder="••••••••">
        </div>

        <div class="forgot-pass-link">
            <a href="#" id="forgotPasswordBtn">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">Log In</button>
    </form>

    <div class="extra-links">
        <p>Don't have an account? <a href="register.html">Sign up</a></p>
        <p style="margin-top:0.5rem;"><a href="../main.html">Back to Home</a></p>
    </div>
</section>

<!-- Оверлей‑модал, показывается только при Google‑login -->
<div class="modal" id="googleModal">
    <div class="content">
        <p>Signing in with Google…</p>
        <div class="loader"></div>
    </div>
</div>

<script type="module">
    // --------------------- Firebase ---------------------
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
        getAuth,
        signInWithEmailAndPassword,
        GoogleAuthProvider,
        OAuthProvider,
        signInWithPopup,
        // signInWithRedirect,          // ← если захотите «redirect», замените ниже
        getRedirectResult,
        onAuthStateChanged,
        setPersistence,
        browserLocalPersistence,
        sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB8DZm6yDyGHD9rWo-bIhsipsKeMXCTcBk",
        authDomain: "physio-cube.firebaseapp.com",
        projectId: "physio-cube",
        storageBucket: "physio-cube.firebasestorage.app",
        messagingSenderId: "593288932552",
        appId: "1:593288932552:web:3b4783b6c16fef9eae09fd",
        measurementId: "G-F5W17MVEZD"
    };

    const app   = initializeApp(firebaseConfig);
    const auth  = getAuth(app);
    // Храним сессию в localStorage, чтобы при перезагрузке пользователь оставался в системе
    setPersistence(auth, browserLocalPersistence);

    // --------------------- UI‑элементы ---------------------
    const loginForm    = document.getElementById('loginForm');
    const loginBtn    = document.getElementById('loginBtn');
    const googleBtn   = document.getElementById('googleBtn');
    const appleBtn    = document.getElementById('appleBtn');
    const forgotPass  = document.getElementById('forgotPasswordBtn');
    const googleModal = document.getElementById('googleModal');

    function showGoogleModal()   { googleModal.classList.add('show'); }
    function hideGoogleModal()   { googleModal.classList.remove('show'); }

    // --------------------- 1️⃣ Обычный Email/Pass ---------------------
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in…';

        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
            const cred = await signInWithEmailAndPassword(auth, email, password);
            // Запоминаем факт входа
            localStorage.setItem('loggedIn', 'true');
            localStorage.setItem('uid', cred.user.uid);
            // Переходим в дашборд
            window.location.href = "../dash.html";
        } catch (err) {
            console.error(err);
            alert("Неправильный e‑mail или пароль.");
            loginBtn.disabled = false;
            loginBtn.textContent = 'Log In';
        }
    });

    // --------------------- 2️⃣ Google (pop‑up) ---------------------
    googleBtn.addEventListener('click', async () => {
        // Показать наш «модальный» индикатор, пока откроется pop‑up
        showGoogleModal();

        const provider = new GoogleAuthProvider();
        // Дополнительные параметры (необязательно)
        // provider.setCustomParameters({prompt: 'select_account'});

        try {
            // **ВАЖНО**: вызов должен быть *прямо* из обработчика клика,
            // иначе браузер может считать pop‑up «заблокированным».
            await signInWithPopup(auth, provider);
            // После успешного входа onAuthStateChanged отработает,
            // а в нём мы уже делаем редирект.
        } catch (error) {
            hideGoogleModal(); // если произошла ошибка – убираем индикатор
            console.error('Google login error:', error);
            if (error.code === 'auth/popup-blocked')
                alert('Поп‑ап был заблокирован браузером. Разрешите всплывающие окна для этого сайта.');
            else
                alert('Не удалось войти через Google: ' + error.message);
        }
    });

    // --------------------- 3️⃣ Apple (pop‑up) ---------------------
    appleBtn.addEventListener('click', async () => {
        const provider = new OAuthProvider('apple.com');
        provider.addScope('email');
        provider.addScope('name');

        try {
            await signInWithPopup(auth, provider);
            // После входа onAuthStateChanged перенаправит
        } catch (err) {
            console.error('Apple login error:', err);
            alert('Не удалось войти через Apple: ' + err.message);
        }
    });

    // --------------------- 4️⃣ Сброс пароля ---------------------
    forgotPass.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (!email) {
            alert('Введите свой e‑mail в поле выше, а потом нажмите «Forgot password?».');
            return;
        }
        try {
            await sendPasswordResetEmail(auth, email);
            alert('Письмо со ссылкой для сброса пароля отправлено. Проверьте почту.');
        } catch (err) {
            console.error('Reset password error:', err);
            let msg = err.message;
            if (err.code === 'auth/user-not-found') msg = 'Пользователь с такой почтой не найден.';
            alert(msg);
        }
    });

    // --------------------- 5️⃣ Автоматический переход, если уже вошёл ---------------------
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Сохраняем данные в localStorage (можно и без этого – Firebase уже хранит токен)
            localStorage.setItem('loggedIn', 'true');
            localStorage.setItem('uid', user.uid);
            // Деактивируем индикатор, если он был включён (Google‑login)
            hideGoogleModal();
            // Если мы сейчас на странице логина – переходим в приложение
            if (!window.location.pathname.endsWith('dash.html')) {
                window.location.href = "../dash.html";
            }
        } else {
            // Пользователь вышел или еще не входил
            localStorage.removeItem('loggedIn');
            localStorage.removeItem('uid');
        }
    });

    // --------------------- 6️⃣ Обработка redirect‑потока (если решите использовать redirect) ---------------------
    // Если вместо pop‑up хотите **redirect**, раскомментируйте строку
    // `await signInWithRedirect(auth, provider);` выше и раскомментируйте код ниже.
    /*
    getRedirectResult(auth)
        .then((result) => {
            if (result?.user) {
                // Пользователь уже авторизован – onAuthStateChanged отработает,
                // но для надёжности сохраняем флаги
                localStorage.setItem('loggedIn', 'true');
                localStorage.setItem('uid', result.user.uid);
                window.location.href = "../dash.html";
            }
        })
        .catch((error) => {
            console.error('Google redirect error:', error);
            // При ошибке можно показать сообщение пользователю
        });
    */
</script>

</body>
</html>
